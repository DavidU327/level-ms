version: '3.8'

services:
  order-db:
    image: postgres:latest
    container_name: level-ms
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: level-ms
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_order:/var/lib/postgresql/data

volumes:
  postgres_data_order:
